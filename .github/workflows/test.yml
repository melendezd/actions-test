name: Test

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
    steps:
      - id: build
        run: |
          run_attempt=${{github.run_attempt}}
          echo 'build_number="woof${{github.run_attempt}}"' >> "$GITHUB_OUTPUT"

  prompt-prod:
    name: Prompt prod
    needs: build
    environment: prod
    runs-on: ubuntu-latest
    outputs:
      approved_run_attempt: ${{ steps.get-approved-run-attempt.outputs.approved_run_attempt }}
    steps:
      - id: get-approved-run-attempt
        run: |
          run_attempt=${{github.run_attempt}}
          echo "Got approval for prod deployment on run attempt $run_attempt"
          echo "approved_run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

  deploy-prod-1:
    name: Deploy prod 1
    needs: [prompt-prod, build]
    if: ${{ github.run_attempt == needs.prompt-prod.outputs.approved_run_attempt }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "pre-deploying to prod: ${{ needs.build.outputs.build_number }}"

  deploy-prod-2:
    name: Deploy prod 2
    needs: [deploy-prod-1, build, prompt-prod]
    if: ${{ github.run_attempt == needs.prompt-prod.outputs.approved_run_attempt }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "deploying to prod: ${{ needs.build.outputs.build_number }}"
